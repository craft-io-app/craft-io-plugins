name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure:
    name: structure and safety checks
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the base branch is present — the version-bump check
      # diffs against it, and reports itself SKIPPED rather than passing if it
      # cannot resolve one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate marketplace, plugins and skills
        run: python3 .github/scripts/validate_plugins.py
      # Runs on push as well as on pull_request. A rule enforced only on the PR
      # path is not enforced: a direct push to main skips it entirely, and that
      # is exactly the commit nobody reviews. On push the base is the commit main
      # pointed at before, so a merge re-checks what its PR already proved and a
      # direct push gets checked for the first time. An unresolvable base (a new
      # branch, a force-push) reports itself SKIPPED rather than passing.
      - name: Require a version bump when shipped assets change
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: python3 .github/scripts/check_version_bump.py "$BASE"
      - name: Prove those rules actually fire
        run: python3 .github/scripts/test_validate_plugins.py

  manifests:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # Informational: the official validator is the same check Anthropic's
    # community-marketplace review runs. It is not a merge gate, because it needs
    # the Claude Code CLI and can change between releases. Note it warns about the
    # deliberately omitted `version` field, so --strict is not used here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate ./plugins/craft-guru
